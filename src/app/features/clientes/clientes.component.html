<div class="container">
    <h3 class="text text-center">Administración de Clientes</h3>
    <div class="row mb-3 mt-3">
        <div class="col col-2">
            <app-nuevo></app-nuevo>
        </div>
        <div class="col col-10">
            <input type="text" class="form-control" placeholder="Buscar cliente por: cédula, nombre o teléfono"
                [(ngModel)]="datoBuscar" (input)="GetBuscar()">
        </div>
    </div>
    <table class="table table-hover resposive">
        <thead>
            <tr>
                <th></th>
                <th scope="col">CEDULA</th>
                <th scope="col">NOMBRE</th>
                <th scope="col">TELEFONO</th>
                <th scope="col">EDAD</th>
                <th></th>
            </tr>
        </thead>
        <tbody>
            <tr *ngFor="let cli of clientes">
                <td><button (click)="(null)" class="btn btn-outline-primary pt-1 pb-1 m-1">
                        <i class="bi bi-shield"></i> Asignar Seguro</button></td>
                <td>{{cli.cedula}}</td>
                <td>{{cli.nombre}}</td>
                <td>{{cli.telefono}}</td>
                <td>{{cli.edad}}</td>
                <td>
                    <div class="btn-group" role="group">
                        <app-actualizar (click)="ObtenerCliente(cli)" title="Actualizar"></app-actualizar>
                        <app-detalles (click)="ObtenerCliente(cli)" title="Ver Detalles">
                        </app-detalles>
                        <button (click)="Confirmar(cli.cedula)" class="btn btn-outline-danger pt-1 pb-1 m-1" title="Eliminar">
                            <i class="bi bi-trash"></i>Eliminar</button>
                    </div>
                </td>
            </tr>
        </tbody>
    </table>
</div>
